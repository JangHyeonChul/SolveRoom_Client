# runner 작업 폴더에서 실행해도 같은 컨테이너를 관리하도록 프로젝트 이름을 고정한다.
name: solveroom-web

services:
  client:
    build: .
    # CI가 GHCR에 올린 이미지를 받아 실행한다. build는 로컬에서 직접 띄울 때 사용.
    image: ghcr.io/janghyeonchul/solveroom-web:latest
    container_name: solveroom-web
    ports:
      - "80:80"
      - "443:443"
    # HTTPS 인증서(EC2의 certbot이 발급·갱신)와 발급 확인 파일 폴더
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /home/ec2-user/.solveroom/certbot/www:/var/www/certbot:ro
    restart: unless-stopped
    networks:
      - solveroom

networks:
  solveroom:
    name: solveroom
    external: true
