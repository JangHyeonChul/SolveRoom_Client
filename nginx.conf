# 웹소켓 업그레이드 요청이면 Connection: upgrade, 아니면 close로 넘긴다
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP: 인증서 확인 파일만 그대로 주고, 나머지는 모두 https://quizcheck.kr로 보낸다
server {
    listen 80;
    server_name _;

    # Let's Encrypt 발급·갱신 확인 파일. EC2에서 certbot이 이 폴더에 파일을 둔다
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://quizcheck.kr$request_uri;
    }
}

# www는 주소 하나로 모은다 (소셜 로그인 콜백 주소를 quizcheck.kr 하나만 등록하기 위해)
server {
    listen 443 ssl;
    http2 on;
    server_name www.quizcheck.kr;

    ssl_certificate     /etc/letsencrypt/live/quizcheck.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quizcheck.kr/privkey.pem;

    return 301 https://quizcheck.kr$request_uri;
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name quizcheck.kr;
    root /usr/share/nginx/html;
    index index.html;

    # 인증서는 EC2의 certbot이 발급·갱신한다 (docker-compose에서 /etc/letsencrypt를 마운트)
    ssl_certificate     /etc/letsencrypt/live/quizcheck.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quizcheck.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # 해시가 붙은 빌드 산출물은 오래 캐시한다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 검색 엔진용 sitemap. 공개 카드 목록으로 서버가 만든다
    location = /sitemap.xml {
        resolver 127.0.0.11 valid=10s;
        set $sitemap_upstream http://solveroom-server:8080/api/main/sitemap.xml;
        proxy_pass $sitemap_upstream;
        proxy_set_header Host $host;
    }

    # 결과 공유 링크(/s/카드 번호?r=맞힌 수-문제 수-점수). 메신저 미리보기용 페이지를 서버가 만든다.
    # 사람이 열면 그 페이지가 카드 화면(/cards/카드 번호)으로 넘긴다
    location ~ ^/s/(?<share_card>\d+)$ {
        resolver 127.0.0.11 valid=10s;
        set $share_upstream http://solveroom-server:8080/api/main/share/cards/$share_card$is_args$args;
        proxy_pass $share_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 카드 상세. 스크립트를 돌리지 않는 검색 로봇(네이버 등)·미리보기 봇도 카드 제목을 보도록
    # index.html의 SSI 자리에 서버가 만든 카드 제목·설명(/api/main/seo/cards/번호/...)을 넣어 내보낸다.
    # 서버가 빈 조각을 주거나 응답하지 못하면 index.html의 기본값(stub)이 그대로 나간다
    location ~ ^/cards/(?<seo_card>\d+)$ {
        ssi on;
        ssi_silent_errors on;
        # 카드 제목이 바뀌면 바로 반영되도록 캐시하지 않는다
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # 위 SSI가 읽는 카드 조각. SSI는 오류 응답의 본문(에러 페이지)도 그대로 끼워 넣으므로,
    # 서버가 오류를 내거나 재시작 중이면 빈 응답으로 바꿔 기본값(stub)이 나가게 한다
    location /api/main/seo/ {
        resolver 127.0.0.11 valid=10s;
        set $seo_upstream http://solveroom-server:8080;
        proxy_pass $seo_upstream;
        proxy_set_header Host $host;
        # 서버가 느려도 카드 화면이 오래 멈추지 않게 짧게 기다린다
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        proxy_intercept_errors on;
        error_page 400 404 500 502 503 504 = @seo_empty;
    }

    location @seo_empty {
        return 204;
    }

    # Spring 서버(solveroom-server)로 API 요청을 넘긴다.
    # 변수로 지정해 서버 컨테이너가 없어도 nginx는 뜨게 하고, Docker 내부 DNS로 매 요청 이름을 찾는다.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://solveroom-server:8080;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 멀티플레이 서버(solveroom-multi): 로비·방 웹소켓과 상태 확인. /api/보다 긴 접두어라 먼저 맞는다
    location /api/multi/ {
        resolver 127.0.0.11 valid=10s;
        set $multi_upstream http://solveroom-multi:8080;
        proxy_pass $multi_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 서버가 25초마다 ping을 보내므로 75초 동안 아무것도 없으면 끊긴 연결로 본다
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }

    # BrowserRouter 경로(/cards/1 등)를 새로고침해도 index.html로 보낸다.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
