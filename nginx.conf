# 웹소켓 업그레이드 요청이면 Connection: upgrade, 아니면 close로 넘긴다
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Let's Encrypt 발급·갱신 확인 파일. EC2에서 certbot이 이 폴더에 파일을 둔다
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 해시가 붙은 빌드 산출물은 오래 캐시한다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Spring 서버(solveroom-server)로 API 요청을 넘긴다.
    # 변수로 지정해 서버 컨테이너가 없어도 nginx는 뜨게 하고, Docker 내부 DNS로 매 요청 이름을 찾는다.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://solveroom-server:8080;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 멀티플레이 서버(solveroom-multi): 로비·방 웹소켓과 상태 확인. /api/보다 긴 접두어라 먼저 맞는다
    location /api/multi/ {
        resolver 127.0.0.11 valid=10s;
        set $multi_upstream http://solveroom-multi:8080;
        proxy_pass $multi_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 서버가 25초마다 ping을 보내므로 75초 동안 아무것도 없으면 끊긴 연결로 본다
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }

    # BrowserRouter 경로(/cards/1 등)를 새로고침해도 index.html로 보낸다.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
