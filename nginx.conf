server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 해시가 붙은 빌드 산출물은 오래 캐시한다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Spring 서버(solveroom-server)로 API 요청을 넘긴다.
    # 변수로 지정해 서버 컨테이너가 없어도 nginx는 뜨게 하고, Docker 내부 DNS로 매 요청 이름을 찾는다.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://solveroom-server:8080;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # BrowserRouter 경로(/cards/1 등)를 새로고침해도 index.html로 보낸다.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
