server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 해시가 붙은 빌드 산출물은 오래 캐시한다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # BrowserRouter 경로(/cards/1 등)를 새로고침해도 index.html로 보낸다.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
