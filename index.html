<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 로고 아이콘. svg를 못 쓰는 브라우저는 ico, iOS 홈 화면은 apple-touch-icon을 쓴다 -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- 카드 상세(/cards/번호)는 nginx가 SSI로 아래 기본값 대신 서버가 만든 카드 제목·설명을 넣는다.
         다른 화면에서는 SSI 주석이 무시되어 block 안의 기본값이 그대로 쓰인다 -->
    <!--# block name="site_head" -->
    <title>퀴즈체크 - 퀴즈 맞추기 · 상식 퀴즈 · 퀴즈 만들기</title>
    <meta name="description" content="퀴즈체크(퀴즈 체크)에서 상식, 노래, 게임, 인물, 한국사, 과학 퀴즈를 맞추고 랭킹에 도전하세요. 직접 퀴즈를 만들고 친구와 멀티플레이로 함께 풀 수 있어요." />
    <meta name="keywords" content="퀴즈체크, 퀴즈 체크, quizcheck, 퀴즈 맞추기, 퀴즈 맞히기, 상식 퀴즈, 노래 맞추기, 인물 퀴즈, 퀴즈 만들기, 멀티플레이 퀴즈" />
    <!-- 링크 공유 미리보기 (카톡·SNS는 스크립트를 실행하지 않아 이 기본값이 보인다) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="퀴즈체크" />
    <meta property="og:title" content="퀴즈체크 - 퀴즈 맞추기 · 상식 퀴즈 · 퀴즈 만들기" />
    <meta property="og:description" content="상식, 노래, 게임, 인물 퀴즈를 맞추고 랭킹에 도전하세요. 직접 퀴즈를 만들어 친구와 함께 풀 수 있어요." />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:image" content="https://quizcheck.kr/icon-512.png" />
    <!--# endblock -->
    <!--# include virtual="/api/main/seo/cards/${seo_card}/head" stub="site_head" -->
    <!-- 구글 애드센스. 사이트 소유 확인과 광고 표시에 같이 쓴다 -->
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9823402152921510"
      crossorigin="anonymous"
    ></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <!-- 앱 CSS는 JS와 함께 늦게 오므로, 그 전에 잠깐 보이는 소개글이 깨져 보이지 않게 여기서 꾸민다 -->
    <style>
      #root > h1, #root > p {
        max-width: 560px; margin: 0 auto; padding: 0 16px; text-align: center;
        font-family: "Pretendard Variable", Pretendard, -apple-system, sans-serif;
        color: #9a9a9a; font-size: 13px; font-weight: 400; line-height: 1.6; word-break: keep-all;
      }
      #root > h1 { padding-top: 40vh; font-size: 15px; font-weight: 600; }
    </style>
  </head>
  <body>
    <!-- 스크립트를 돌리지 않는 검색 로봇(네이버 등)이 읽을 소개글. 카드 상세는 카드 소개로 바뀐다. 앱이 뜨면 React가 이 내용을 지우고 화면을 그린다 -->
    <div id="root">
      <!--# block name="site_intro" -->
      <h1>퀴즈체크 - 퀴즈 맞추기</h1>
      <p>퀴즈체크(퀴즈 체크, quizcheck)는 직접 만든 퀴즈 카드를 풀고 랭킹에 도전하는 퀴즈 사이트입니다. 혼자 풀거나 멀티플레이 방에서 친구와 함께 맞출 수 있습니다.</p>
      <p>게임, 음악(노래 맞추기), 문화, 방송, 상식, 만화, 음식, 인물, 스포츠, 병맛, 한국사, 과학 퀴즈가 있습니다.</p>
      <!--# endblock -->
      <!--# include virtual="/api/main/seo/cards/${seo_card}/body" stub="site_intro" -->
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
