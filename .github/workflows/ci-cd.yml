name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/janghyeonchul/solveroom-web

jobs:
  # PR과 main push 모두: 타입 검사·빌드 (GitHub 호스티드 러너)
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - name: 타입 검사·빌드
        run: |
          npm ci
          npm run build

  # main만: 이미지 빌드 후 GHCR에 업로드 (GitHub 호스티드 러너)
  build:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 이미지 빌드·업로드
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # main만: EC2의 self-hosted runner에서 새 이미지로 교체
  # 공개 저장소이므로 PR에서는 절대 self-hosted runner를 쓰지 않는다.
  deploy:
    needs: build
    runs-on: [self-hosted, solveroom-dev]
    concurrency:
      group: deploy-web
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: docker-compose.yml
          sparse-checkout-cone-mode: false
      - name: GHCR 로그인
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: 새 이미지로 교체
        run: |
          docker compose pull
          docker compose up -d --no-build --remove-orphans
      - name: 페이지 응답 확인
        run: curl -fsS --retry 10 --retry-delay 3 --retry-all-errors -o /dev/null http://localhost/
      - name: 정리
        if: always()
        run: |
          docker logout ghcr.io
          docker image prune -f
